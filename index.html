<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Move — Lead Scraper</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --surface: #f5f5f4;
    --border: rgba(0,0,0,0.10);
    --border-md: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --muted: #6b6b66;
    --faint: #a0a09a;
    --accent: #1a1a18;
    --accent-fg: #ffffff;
    --success: #15803d;
    --success-bg: #f0fdf4;
    --success-border: #bbf7d0;
    --warn: #b45309;
    --warn-bg: #fffbeb;
    --warn-border: #fde68a;
    --danger: #b91c1c;
    --danger-bg: #fef2f2;
    --danger-border: #fecaca;
    --info: #1d4ed8;
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Mono', 'Courier New', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121210;
      --surface: #1c1c1a;
      --border: rgba(255,255,255,0.08);
      --border-md: rgba(255,255,255,0.15);
      --text: #e8e8e2;
      --muted: #9a9a92;
      --faint: #6a6a62;
      --accent: #e8e8e2;
      --accent-fg: #121210;
      --success: #4ade80;
      --success-bg: rgba(74,222,128,0.08);
      --success-border: rgba(74,222,128,0.2);
      --warn: #fbbf24;
      --warn-bg: rgba(251,191,36,0.08);
      --warn-border: rgba(251,191,36,0.2);
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.08);
      --danger-border: rgba(248,113,113,0.2);
      --info: #60a5fa;
    }
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100vh; }

  #root { min-height: 100vh; display: flex; flex-direction: column; }

  .app { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; width: 100%; flex: 1; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 0.5px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10; }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--text); text-decoration: none; }
  .logo-icon { width: 30px; height: 30px; background: var(--accent); color: var(--accent-fg); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 16px; }

  .key-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: var(--surface); border: 0.5px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; transition: border-color 0.15s; }
  .key-btn:hover { border-color: var(--border-md); }
  .key-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
  .key-dot.active { background: var(--success); }

  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
  input, textarea, select { font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); border: 0.5px solid var(--border-md); border-radius: var(--radius); padding: 8px 12px; outline: none; transition: border-color 0.15s; width: 100%; }
  input:focus, textarea:focus, select:focus { border-color: var(--text); }
  input::placeholder, textarea::placeholder { color: var(--faint); }

  .btn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font); font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: var(--radius); border: 0.5px solid var(--border-md); background: var(--bg); color: var(--text); cursor: pointer; transition: background 0.15s, border-color 0.15s; white-space: nowrap; }
  .btn:hover { background: var(--surface); }
  .btn:active { opacity: 0.85; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.primary:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .grid-2 { display: grid; grid-template-columns: minmax(0,1fr) 270px; gap: 16px; align-items: start; }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); }
  .surface-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); }

  .stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 1.25rem; }
  @media (max-width: 500px) { .stat-grid { grid-template-columns: repeat(2,1fr); } }
  .stat-btn { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s; }
  .stat-btn:hover { background: var(--surface); }
  .stat-btn.active { background: var(--surface); border-color: var(--border-md); }
  .stat-num { font-size: 20px; font-weight: 600; color: var(--text); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .table-wrap { overflow-x: auto; border: 0.5px solid var(--border); border-radius: var(--radius-lg); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { background: var(--surface); border-bottom: 0.5px solid var(--border); }
  th { text-align: left; padding: 9px 12px; font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  tbody tr { border-bottom: 0.5px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface); }
  td { padding: 10px 12px; vertical-align: top; }

  .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .pill-success { background: var(--success-bg); color: var(--success); border: 0.5px solid var(--success-border); }
  .pill-warn { background: var(--warn-bg); color: var(--warn); border: 0.5px solid var(--warn-border); }
  .pill-danger { background: var(--danger-bg); color: var(--danger); border: 0.5px solid var(--danger-border); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .log-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
  .log-line { display: flex; gap: 8px; font-size: 12px; font-family: var(--mono); line-height: 1.5; }
  .log-arrow { color: var(--faint); flex-shrink: 0; }
  .log-info { color: var(--muted); }
  .log-success { color: var(--success); }
  .log-warn { color: var(--warn); }
  .log-error { color: var(--danger); }

  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

  .notice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 12px; color: var(--muted); line-height: 1.5; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
  .modal { background: var(--bg); border: 0.5px solid var(--border-md); border-radius: var(--radius-lg); padding: 1.5rem; width: 100%; max-width: 420px; }
  .modal h3 { font-size: 16px; font-weight: 500; margin-bottom: 0.5rem; }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 1rem; line-height: 1.6; }

  a { color: var(--info); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .text-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
  .score-reason { font-size: 11px; color: var(--faint); line-height: 1.4; margin-top: 4px; max-width: 200px; }

  .empty-state { padding: 3rem; text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useRef, useEffect, createElement: h } = React;

const LS = {
  provider:    "move_provider",
  antKey:      "move_ant_key",
  ollamaUrl:   "move_ollama_url",
  ollamaModel: "move_ollama_model",
  serperKey:   "move_serper_key",
  geminiKey:   "move_gemini_key",
};

async function askAnthropic(key, messages, system, webSearch) {
  const body = { model: "claude-haiku-4-5-20251001", max_tokens: 1000, messages };
  if (system) body.system = system;
  if (webSearch) body.tools = [{ type: "web_search_20250305", name: "web_search" }];
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return (d.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
}

async function askGemini(key, prompt, useSearch) {
  const body = {
    contents: [{ role: "user", parts: [{ text: prompt }] }],
    generationConfig: { maxOutputTokens: 1000 },
    ...(useSearch && { tools: [{ googleSearch: {} }] })
  };
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
}

async function askOllama(url, model, messages, system) {
  const msgs = system ? [{ role: "system", content: system }, ...messages] : messages;
  const r = await fetch(`${url.replace(/\/$/, "")}/v1/chat/completions`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model, messages: msgs, stream: false })
  });
  const d = await r.json();
  if (d.error) throw new Error(typeof d.error === "string" ? d.error : JSON.stringify(d.error));
  return d.choices?.[0]?.message?.content || "";
}

async function searchSerper(key, query) {
  const r = await fetch("https://google.serper.dev/search", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-API-KEY": key },
    body: JSON.stringify({ q: query, num: 8 })
  });
  const d = await r.json();
  const results = (d.organic || []).map(x => `Title: ${x.title}\nURL: ${x.link}\nSnippet: ${x.snippet}`).join("\n\n");
  return results || "No results found.";
}

function parseArr(text) {
  const s = text.replace(/```json\n?/g, "").replace(/```\n?/g, "").trim();
  const m = s.match(/\[[\s\S]*\]/);
  return JSON.parse(m ? m[0] : s);
}

function ScorePill({ score }) {
  const s = score || 0;
  const cls = s >= 8 ? "pill pill-success" : s >= 5 ? "pill pill-warn" : "pill pill-danger";
  const dotColor = s >= 8 ? "var(--success)" : s >= 5 ? "var(--warn)" : "var(--danger)";
  return h("span", { className: cls },
    h("span", { className: "dot", style: { background: dotColor } }),
    `${s}/10`
  );
}

function SettingsModal({ settings, onSave, onClose }) {
  const [provider, setProvider] = useState(settings.provider || "gemini");
  const [antKey,      setAntKey]      = useState(settings.antKey      || "");
  const [geminiKey,   setGeminiKey]   = useState(settings.geminiKey   || "");
  const [ollamaUrl,   setOllamaUrl]   = useState(settings.ollamaUrl   || "http://localhost:11434");
  const [ollamaModel, setOllamaModel] = useState(settings.ollamaModel || "qwen3");
  const [serperKey,   setSerperKey]   = useState(settings.serperKey   || "");

  const save = () => {
    onSave({ provider, antKey, geminiKey, ollamaUrl, ollamaModel, serperKey });
    onClose();
  };

  const tabStyle = (active) => ({
    flex: 1, padding: "7px 0", fontSize: 12, fontWeight: 500, cursor: "pointer",
    border: "0.5px solid var(--border-md)", background: active ? "var(--accent)" : "var(--bg)",
    color: active ? "var(--accent-fg)" : "var(--muted)", borderRadius: "var(--radius)",
    transition: "background 0.15s"
  });

  return h("div", { className: "modal-overlay", onClick: e => { if (e.target === e.currentTarget) onClose(); } },
    h("div", { className: "modal", style: { maxWidth: 460 } },
      h("h3", null, "AI provider settings"),

      h("div", { style: { display: "flex", gap: 6, marginBottom: 16 } },
        h("button", { style: tabStyle(provider === "gemini"), onClick: () => setProvider("gemini") },
          h("i", { className: "ti ti-brand-google", style: { marginRight: 4 }, "aria-hidden": "true" }),
          "Gemini"
        ),
        h("button", { style: tabStyle(provider === "anthropic"), onClick: () => setProvider("anthropic") },
          h("i", { className: "ti ti-brand-anthropic", style: { marginRight: 4 }, "aria-hidden": "true" }),
          "Anthropic"
        ),
        h("button", { style: tabStyle(provider === "ollama"), onClick: () => setProvider("ollama") },
          h("i", { className: "ti ti-server", style: { marginRight: 4 }, "aria-hidden": "true" }),
          "Ollama"
        )
      ),

      provider === "gemini" && h("div", null,
        h("p", null,
          "Uses Gemini 2.0 Flash with built-in Google Search. Very high free limits — no rate limit issues. Get a free API key at ",
          h("a", { href: "https://aistudio.google.com/apikey", target: "_blank", rel: "noopener" }, "aistudio.google.com"), "."
        ),
        h("div", { style: { marginBottom: 12 } },
          h("label", null, "Google AI Studio API key"),
          h("input", { type: "password", value: geminiKey, onChange: e => setGeminiKey(e.target.value), placeholder: "AIza..." })
        ),
        h("div", { className: "notice" },
          h("i", { className: "ti ti-info-circle", style: { fontSize: 15, flexShrink: 0, marginTop: 1 }, "aria-hidden": "true" }),
          h("span", null, "Sign in with your Google Workspace account at AI Studio to get your free key.")
        )
      ),

      provider === "anthropic" && h("div", null,
        h("p", null,
          "Uses Claude Haiku with built-in web search. Free tier has low rate limits. Get a key at ",
          h("a", { href: "https://console.anthropic.com/keys", target: "_blank", rel: "noopener" }, "console.anthropic.com"), "."
        ),
        h("div", { style: { marginBottom: 12 } },
          h("label", null, "Anthropic API key"),
          h("input", { type: "password", value: antKey, onChange: e => setAntKey(e.target.value), placeholder: "sk-ant-..." })
        )
      ),

      provider === "ollama" && h("div", null,
        h("p", null,
          "Uses your local Ollama model. ",
          h("strong", null, "Requires Serper.dev for web search"), " (free — 2,500 searches/month at ",
          h("a", { href: "https://serper.dev", target: "_blank", rel: "noopener" }, "serper.dev"), ")."
        ),
        h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 } },
          h("div", null,
            h("label", null, "Ollama URL"),
            h("input", { value: ollamaUrl, onChange: e => setOllamaUrl(e.target.value), placeholder: "http://localhost:11434" })
          ),
          h("div", null,
            h("label", null, "Model name"),
            h("input", { value: ollamaModel, onChange: e => setOllamaModel(e.target.value), placeholder: "qwen3:latest" })
          )
        ),
        h("div", { style: { marginBottom: 10 } },
          h("label", null, "Serper.dev API key"),
          h("input", { type: "password", value: serperKey, onChange: e => setSerperKey(e.target.value), placeholder: "your-serper-key" })
        ),
        h("div", { className: "notice" },
          h("i", { className: "ti ti-info-circle", style: { fontSize: 15, flexShrink: 0, marginTop: 1 }, "aria-hidden": "true" }),
          h("span", null, "Enable CORS first: run ",
            h("code", { style: { fontFamily: "var(--mono)", background: "var(--surface)", padding: "1px 5px", borderRadius: 4, fontSize: 11 } }, "OLLAMA_ORIGINS=* ollama serve"),
            " in your terminal."
          )
        )
      ),

      h("div", { style: { display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 12 } },
        h("button", { className: "btn", onClick: onClose }, "Cancel"),
        h("button", { className: "btn primary", onClick: save }, "Save settings")
      )
    )
  );
}

function App() {
  const MOVE_ICP = `MOVE SUPPLY CHAIN — IDEAL CUSTOMER PROFILE (ICP)

COMPANY PROFILE
- Type: Start-up or mid-size DTC / e-commerce brand
- Revenue: $0–$10M ARR
- Team size: 1–10 employees
- Primary market: United States | Secondary: UK, Australia

TARGET INDUSTRIES (Top 5)
1. Apparel & Fashion
2. Formulated Products (supplements, cosmetics, CPG)
3. Packaging
4. Home Goods
5. Accessories

KEY DECISION-MAKERS
- Founders, CEOs, COOs
- Personas: solo founder launching first SKU ("Starter Stella"), co-founder scaling $1–5M ARR ("Scaling Sam"), or CEO of $10M+ brand ("Enterprise Eva")

SERVICES MOVE OFFERS
- Sourcing & Vendor Management (China & Vietnam audits)
- Inventory Management & Demand Planning
- New Product Development (NPD)
- Done-For-You (DFY): 1–6 months, $4,000
- Done-With-You (DWY): RPO, 6–12 months, $2,000–$5,000
- DIY: Move Accelerator course, $500–$1,500
- Pricing range: $2,000–$8,000/month

PAIN POINTS TO LOOK FOR
- Stockouts or overstock issues tying up cash flow
- Guesswork-based demand forecasting (Excel nightmares)
- No visibility across 3PLs or Shopify/ERP data silos
- Tariff exposure and supply chain disruptions
- No in-house supply chain or operations expertise
- Vendor accreditation or quality control problems
- Manual, time-consuming inventory tracking

SCORING CRITERIA (rank higher if they match)
- E-commerce / DTC brand with physical products
- Revenue between $500K–$10M ARR (sweet spot: $1M–$5M)
- Small founding team with no dedicated ops/supply chain hire
- Selling in the US (or expanding to US)
- Products sourced from Asia (China, Vietnam, etc.)
- Has experienced stockouts, tariff issues, or 3PL problems
- Actively hiring ops/supply chain roles (signal: they need help)
- Uses Shopify as their primary platform`;

  const loadSettings = () => ({
    provider:    localStorage.getItem(LS.provider)    || "gemini",
    antKey:      localStorage.getItem(LS.antKey)      || "",
    geminiKey:   localStorage.getItem(LS.geminiKey)   || "",
    ollamaUrl:   localStorage.getItem(LS.ollamaUrl)   || "http://localhost:11434",
    ollamaModel: localStorage.getItem(LS.ollamaModel) || "qwen3:latest",
    serperKey:   localStorage.getItem(LS.serperKey)   || "",
  });

  const [settings, setSettings] = useState(loadSettings);
  const [showSettings, setShowSettings] = useState(false);
  const [screen, setScreen] = useState("setup");
  const [icp, setIcp] = useState(MOVE_ICP);
  const [hints, setHints] = useState({ industry: "E-commerce, DTC, Apparel, Home Goods, Formulated Products", location: "United States", titles: "Founder, CEO, COO", keywords: "Shopify, sourcing, supply chain, DTC brand, inventory" });
  const [leads, setLeads] = useState([]);
  const [log, setLog] = useState([]);
  const [filter, setFilter] = useState("all");
  const logEl = useRef(null);
  const logRef = useRef([]);

  const saveSettings = (s) => {
    Object.keys(LS).forEach(k => localStorage.setItem(LS[k], s[k] || ""));
    setSettings(s);
  };

  const isReady = settings.provider === "anthropic" ? !!settings.antKey
    : settings.provider === "gemini" ? !!settings.geminiKey
    : !!(settings.ollamaUrl && settings.ollamaModel && settings.serperKey);

  const push = (msg, type) => {
    const e = { msg, type: type || "info", id: Date.now() + Math.random() };
    logRef.current = [...logRef.current, e];
    setLog([...logRef.current]);
  };

  useEffect(() => { if (logEl.current) logEl.current.scrollTop = logEl.current.scrollHeight; }, [log]);

  const llm = async (messages, system, webSearch) => {
    if (settings.provider === "gemini") {
      const prompt = (system ? system + "\n\n" : "") + messages.map(m => m.content).join("\n");
      return askGemini(settings.geminiKey, prompt, webSearch);
    } else if (settings.provider === "anthropic") {
      return askAnthropic(settings.antKey, messages, system, webSearch);
    } else {
      return askOllama(settings.ollamaUrl, settings.ollamaModel, messages, system);
    }
  };

  const delay = ms => new Promise(res => setTimeout(res, ms));
  const shortIcp = icp.slice(0, 400);
  const isGemini = settings.provider === "gemini";
  const searchDelay = isGemini ? 1000 : 15000;

  const run = async () => {
    if (!icp.trim() || !isReady) return;
    setScreen("running"); logRef.current = []; setLog([]); setLeads([]);
    const usingOllama = settings.provider === "ollama";

    try {
      push(`Using ${isGemini ? "Gemini 2.0 Flash + Google Search" : usingOllama ? `Ollama (${settings.ollamaModel}) + Serper` : "Anthropic Claude + web search"}…`);
      push("Generating search queries from your ICP…");

      const qText = await llm([{
        role: "user",
        content: `B2B lead gen expert. Find leads for this ICP:\nIndustry: ${hints.industry || "E-commerce/DTC"}, Location: ${hints.location || "US"}, Titles: ${hints.titles || "Founder/CEO"}, Keywords: ${hints.keywords || "Shopify supply chain"}\n\nGenerate 3 short Google search queries to find real leads. Target LinkedIn profiles, company pages, directories.\n\nReturn ONLY a JSON array of 3 strings. No markdown.`
      }]);

      let queries;
      try { queries = parseArr(qText).slice(0, 3); }
      catch { queries = [`DTC brand founder ${hints.location || "US"} LinkedIn`, `e-commerce CEO ${hints.location || ""} Shopify`]; }
      push(`Generated ${queries.length} queries`, "success");

      const raw = [];
      for (let i = 0; i < queries.length; i++) {
        const q = queries[i];
        push(`Searching [${i + 1}/${queries.length}]: "${q}"`);
        await delay(searchDelay);
        try {
          let res;
          if (usingOllama) {
            const snippets = await searchSerper(settings.serperKey, q);
            res = await llm([{
              role: "user",
              content: `Search results for "${q}":\n\n${snippets}\n\nExtract up to 2 leads. For each: name, company, title, email (or null), linkedin (or null), source.\n\nReturn ONLY a JSON array. Empty [] if none. No markdown.`
            }], "Return only valid JSON arrays.");
          } else {
            res = await llm(
              [{ role: "user", content: `Search for: "${q}"\n\nExtract up to 2 real DTC/e-commerce leads. For each: name, company, title, email (or null), linkedin (or null), source.\n\nICP: ${shortIcp}\n\nReturn ONLY a JSON array. Empty [] if none. No markdown.` }],
              "Return only valid JSON arrays.",
              true
            );
          }
          await delay(searchDelay);
          const arr = parseArr(res);
          if (Array.isArray(arr) && arr.length) { raw.push(...arr); push(`Found ${arr.length} lead(s)`, "success"); }
          else push("No leads from this search", "warn");
        } catch (e) { push(`Skipped: ${String(e.message).slice(0, 80)}`, "warn"); }
      }

      const seen = new Set();
      const unique = raw.filter(l => {
        const k = `${(l.name || "").toLowerCase().trim()}|${(l.company || "").toLowerCase().trim()}`;
        if (!k || k === "|" || seen.has(k)) return false;
        seen.add(k); return true;
      });
      push(`Deduplicating → ${unique.length} unique leads`);

      if (!unique.length) { push("No leads found. Try broadening your hints.", "warn"); setLeads([]); setScreen("results"); return; }

      push(`Scoring ${unique.length} leads against your ICP…`);
      await delay(searchDelay);
      const scoreText = await llm([{
        role: "user",
        content: `ICP summary: ${shortIcp}\n\nScore each lead (1-10, 10=perfect match). Add 1-sentence scoreReason.\n\nLeads: ${JSON.stringify(unique)}\n\nReturn ONLY JSON array with original fields + score (int) + scoreReason. No markdown.`
      }]);

      let scored;
      try { scored = parseArr(scoreText); scored.sort((a, b) => (b.score || 0) - (a.score || 0)); }
      catch { scored = unique.map(l => ({ ...l, score: 5, scoreReason: "Could not score" })); }

      setLeads(scored);
      push(`Done! ${scored.length} leads scored and ranked.`, "success");
      setScreen("results");
    } catch (e) { push(`Error: ${e.message}`, "error"); }
  };

  const exportCSV = () => {
    const hd = ["Name", "Company", "Title", "Email", "LinkedIn", "Score", "Score Reason", "Source"];
    const rows = leads.map(l => [l.name, l.company, l.title, l.email, l.linkedin, l.score, l.scoreReason, l.source]);
    const csv = [hd, ...rows].map(r => r.map(v => `"${String(v || "").replace(/"/g, '""')}"`).join(",")).join("\n");
    Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })),
      download: "leads.csv"
    }).click();
  };

  const high = leads.filter(l => l.score >= 8).length;
  const mid = leads.filter(l => l.score >= 5 && l.score < 8).length;
  const low = leads.filter(l => l.score < 5).length;
  const filtered = filter === "all" ? leads : filter === "high" ? leads.filter(l => l.score >= 8) : filter === "mid" ? leads.filter(l => l.score >= 5 && l.score < 8) : leads.filter(l => l.score < 5);

  const hintField = (label, key, placeholder) =>
    h("div", null,
      h("label", null, label),
      h("input", { value: hints[key], onChange: e => setHints(p => ({ ...p, [key]: e.target.value })), placeholder })
    );

  const Header = () => h("header", null,
    h("div", { className: "logo" },
      h("div", { className: "logo-icon" }, h("i", { className: "ti ti-radar", "aria-hidden": "true" })),
      "Move — Lead Scraper"
    ),
    h("button", { className: "key-btn", onClick: () => setShowSettings(true) },
      h("span", { className: `key-dot ${isReady ? "active" : ""}` }),
      isReady
        ? (settings.provider === "gemini" ? "Gemini 2.0 Flash"
          : settings.provider === "ollama" ? `Ollama · ${settings.ollamaModel}`
          : "Anthropic · Claude")
        : "Set up provider"
    )
  );

  return h("div", { style: { minHeight: "100vh", display: "flex", flexDirection: "column" } },
    h(Header),
    showSettings && h(SettingsModal, { settings, onSave: saveSettings, onClose: () => setShowSettings(false) }),

    h("div", { className: "app" },

      screen === "setup" && h("div", null,
        h("div", { style: { margin: "2rem 0 1.5rem" } },
          h("h1", { style: { fontSize: 24, fontWeight: 600, marginBottom: 6 } }, "Find Move's next client"),
          h("p", { style: { fontSize: 14, color: "var(--muted)" } }, "ICP pre-loaded from your GTM plan. Adjust location and hit Find leads — the agent does the rest.")
        ),
        !isReady && h("div", { className: "notice", style: { marginBottom: "1.5rem", borderColor: "var(--warn-border)", background: "var(--warn-bg)" } },
          h("i", { className: "ti ti-settings", style: { fontSize: 16, color: "var(--warn)", flexShrink: 0, marginTop: 1 }, "aria-hidden": "true" }),
          h("span", null, "Set up your AI provider before running. ",
            h("button", { onClick: () => setShowSettings(true), style: { background: "none", border: "none", color: "var(--info)", cursor: "pointer", fontSize: 12, padding: 0, fontFamily: "inherit" } }, "Configure here →")
          )
        ),
        h("div", { className: "grid-2" },
          h("div", null,
            h("label", null, "ICP — pre-loaded from Move's GTM plan (editable)"),
            h("textarea", {
              value: icp,
              onChange: e => setIcp(e.target.value),
              placeholder: "Move's ICP is pre-loaded. You can edit or add to it.",
              style: { height: 280, resize: "vertical", lineHeight: 1.6, padding: "10px 12px" }
            })
          ),
          h("div", { style: { display: "flex", flexDirection: "column", gap: 12 } },
            hintField("Industry", "industry", "e.g. SaaS, fintech, e-commerce"),

            h("div", null,
              h("label", null, "Location"),
              h("input", {
                value: hints.location,
                onChange: e => setHints(p => ({ ...p, location: e.target.value })),
                list: "us-metros",
                placeholder: "Type or pick a US city / state",
                style: { width: "100%" }
              }),
              h("datalist", { id: "us-metros" },
                [
                  "United States (nationwide)",
                  "— California —",
                  "Los Angeles, CA",
                  "Southern California",
                  "San Diego, CA",
                  "San Francisco, CA",
                  "Bay Area, CA",
                  "Sacramento, CA",
                  "Orange County, CA",
                  "— New York —",
                  "New York City, NY",
                  "Brooklyn, NY",
                  "Long Island, NY",
                  "— Texas —",
                  "Austin, TX",
                  "Dallas, TX",
                  "Houston, TX",
                  "San Antonio, TX",
                  "— Florida —",
                  "Miami, FL",
                  "Orlando, FL",
                  "Tampa, FL",
                  "— Other Major metros —",
                  "Chicago, IL",
                  "Seattle, WA",
                  "Atlanta, GA",
                  "Denver, CO",
                  "Phoenix, AZ",
                  "Boston, MA",
                  "Las Vegas, NV",
                  "Portland, OR",
                  "Nashville, TN",
                  "Charlotte, NC",
                  "Minneapolis, MN",
                  "Detroit, MI",
                  "Philadelphia, PA",
                  "Pittsburgh, PA",
                  "Columbus, OH",
                  "Raleigh, NC",
                  "Salt Lake City, UT",
                  "Kansas City, MO",
                  "Indianapolis, IN",
                  "— International —",
                  "United Kingdom",
                  "Australia",
                  "Canada",
                ].map(opt =>
                  opt.startsWith("—")
                    ? h("option", { key: opt, disabled: true, value: opt })
                    : h("option", { key: opt, value: opt })
                )
              )
            ),

            hintField("Target job titles", "titles", "e.g. CEO, Founder, VP Sales"),
            hintField("Additional keywords", "keywords", "e.g. Series A, hiring, bootstrapped"),
            h("button", {
              className: "btn primary",
              onClick: run,
              disabled: !icp.trim() || !isReady,
              style: { marginTop: 4, justifyContent: "center", padding: "10px 0" }
            },
              h("i", { className: "ti ti-player-play", "aria-hidden": "true" }),
              "Find leads"
            ),
            h("p", { style: { fontSize: 11, color: "var(--faint)", lineHeight: 1.5 } },
              "Runs 5 searches, extracts leads, and scores against your ICP. Takes about 1–2 minutes."
            )
          )
        )
      ),

      screen === "running" && h("div", { style: { marginTop: "2rem" } },
        h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: "1.25rem" } },
          h("span", { style: { width: 8, height: 8, borderRadius: "50%", background: "var(--success)", display: "inline-block" }, className: "pulse" }),
          h("span", { style: { fontSize: 14, fontWeight: 500 } }, "Agent running…"),
          h("span", { style: { fontSize: 12, color: "var(--muted)" } }, "3–5 minutes (free tier pacing)")
        ),
        h("div", { ref: logEl, className: "log-box" },
          log.length === 0 ? h("span", { className: "log-line log-info" }, h("span", { className: "log-arrow" }, "›"), "Starting…") :
            log.map(l => h("div", { key: l.id, className: `log-line log-${l.type || "info"}` },
              h("span", { className: "log-arrow" }, "›"),
              l.msg
            ))
        )
      ),

      screen === "results" && h("div", { style: { marginTop: "2rem" } },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "1.5rem", flexWrap: "wrap", gap: 10 } },
          h("div", null,
            h("h2", { style: { fontSize: 20, fontWeight: 600, marginBottom: 4 } }, "Results"),
            h("p", { style: { fontSize: 13, color: "var(--muted)" } }, `${leads.length} leads found and scored`)
          ),
          h("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } },
            h("button", { className: "btn", onClick: () => { setLeads([]); setLog([]); logRef.current = []; setFilter("all"); setScreen("setup"); } },
              h("i", { className: "ti ti-refresh", "aria-hidden": "true" }), "New search"
            ),
            leads.length > 0 && h("button", { className: "btn", onClick: exportCSV },
              h("i", { className: "ti ti-download", "aria-hidden": "true" }), "Export CSV"
            )
          )
        ),

        leads.length === 0
          ? h("div", { className: "empty-state card" }, "No leads found. Try broadening your ICP or adding more search hints.")
          : h("div", null,
            h("div", { className: "stat-grid" },
              [["all", leads.length, "All leads"], ["high", high, "High fit (8–10)"], ["mid", mid, "Medium (5–7)"], ["low", low, "Low fit (1–4)"]].map(([k, v, label]) =>
                h("button", { key: k, className: `stat-btn ${filter === k ? "active" : ""}`, onClick: () => setFilter(k) },
                  h("div", { className: "stat-num" }, v),
                  h("div", { className: "stat-label" }, label)
                )
              )
            ),
            h("div", { className: "table-wrap" },
              h("table", null,
                h("thead", null,
                  h("tr", null,
                    ["Name", "Company", "Title", "Email", "LinkedIn", "ICP score"].map(col =>
                      h("th", { key: col }, col)
                    )
                  )
                ),
                h("tbody", null,
                  filtered.map((l, i) =>
                    h("tr", { key: i },
                      h("td", null, h("span", { className: "text-truncate", style: { display: "block", fontWeight: 500 } }, l.name || "—")),
                      h("td", null, h("span", { className: "text-truncate", style: { display: "block", color: "var(--muted)" } }, l.company || "—")),
                      h("td", null, h("span", { className: "text-truncate", style: { display: "block", color: "var(--muted)" } }, l.title || "—")),
                      h("td", null, l.email ? h("a", { href: `mailto:${l.email}`, style: { fontSize: 12 } }, l.email) : h("span", { style: { color: "var(--faint)" } }, "—")),
                      h("td", null, l.linkedin
                        ? h("a", { href: l.linkedin, target: "_blank", rel: "noopener noreferrer", style: { display: "inline-flex", alignItems: "center", gap: 4, fontSize: 12 } },
                          h("i", { className: "ti ti-external-link", style: { fontSize: 13 }, "aria-hidden": "true" }), "View")
                        : h("span", { style: { color: "var(--faint)" } }, "—")
                      ),
                      h("td", null,
                        h(ScorePill, { score: l.score }),
                        l.scoreReason && h("div", { className: "score-reason" }, l.scoreReason)
                      )
                    )
                  )
                )
              )
            ),
            h("div", { className: "notice", style: { marginTop: "1rem" } },
              h("i", { className: "ti ti-table-import", style: { fontSize: 16, flexShrink: 0, marginTop: 1 }, "aria-hidden": "true" }),
              h("span", null, "To import to Google Sheets: open ", h("strong", null, "sheets.google.com"), " → File → Import → Upload the CSV file.")
            )
          )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
